<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据结构与算法可视化 · 严蔚敏《数据结构(C语言版)》</title>
<style>
  :root{
    --bg:#0b1220; --bg2:#0e1626; --panel:#141d33; --line:#22304e;
    --txt:#e6eeff; --dim:#8ea3c9; --dim2:#6d82ab; --accent:#5b8cff;
    --ok:#2ecc71; --warn:#ffd166;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column;
  }
  header{
    padding:14px 22px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#101a2e,#0d1526);
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  header h1{margin:0; font-size:18px; letter-spacing:.3px}
  header .book{color:var(--dim); font-size:12.5px}
  header .prog{
    margin-left:auto; font-size:12.5px; color:var(--dim);
    display:flex; align-items:center; gap:10px;
  }
  .bar{width:150px; height:6px; border-radius:3px; background:#1c2740; overflow:hidden}
  .bar i{display:block; height:100%; background:linear-gradient(90deg,#2ecc71,#6ceaa5)}
  main{flex:1; display:flex; min-height:0}
  nav{
    width:290px; flex-shrink:0; overflow-y:auto; padding:12px 0 40px;
    border-right:1px solid var(--line); background:var(--bg2);
  }
  nav .search{padding:0 14px 12px}
  nav input{
    width:100%; padding:8px 11px; border-radius:8px; color:var(--txt);
    border:1px solid var(--line); background:#0f1829; font-size:13px;
  }
  nav input:focus{outline:none; border-color:var(--accent)}
  .chap{margin:0 8px 4px}
  .chap>summary{
    padding:8px 12px; cursor:pointer; border-radius:8px; font-weight:600;
    font-size:13px; color:#cfdcf8; list-style:none; display:flex; gap:8px;
  }
  .chap>summary::-webkit-details-marker{display:none}
  .chap>summary:hover{background:#16203a}
  .chap>summary .cnt{margin-left:auto; color:var(--dim2); font-weight:400; font-size:12px}
  .chap>summary::before{content:"▸"; color:var(--dim2); transition:transform .15s}
  .chap[open]>summary::before{transform:rotate(90deg)}
  .item{
    display:flex; align-items:center; gap:8px; padding:6px 12px 6px 30px;
    margin:1px 4px; border-radius:7px; cursor:pointer; font-size:12.5px;
    color:var(--dim); border:1px solid transparent;
  }
  .item:hover{background:#16203a; color:var(--txt)}
  .item.on{background:#1b2b4d; border-color:#2f52bd; color:#fff}
  .item .dot{width:7px; height:7px; border-radius:50%; flex-shrink:0}
  .item.ready .dot{background:var(--ok)}
  .item.todo .dot{background:#3a4a6d}
  .item.todo{color:var(--dim2)}
  section#view{flex:1; overflow:auto; padding:18px 22px 40px; min-width:0}
  #host svg{display:block; max-width:100%; height:auto;
            border-radius:14px; box-shadow:0 8px 30px rgba(0,0,0,.35)}
  iframe{width:100%; height:720px; border:0; border-radius:14px;
         box-shadow:0 8px 30px rgba(0,0,0,.35); background:var(--bg2)}
  .empty{
    max-width:660px; margin:6vh auto; text-align:center; color:var(--dim);
  }
  .empty h2{color:var(--txt); font-size:20px; margin:0 0 10px}
  .empty code{background:#16203a; padding:2px 6px; border-radius:5px; font-size:12.5px}
  .todoCard{
    max-width:620px; margin:8vh auto; padding:26px 28px; text-align:center;
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
  }
  .todoCard h2{margin:0 0 8px; font-size:18px}
  .todoCard p{color:var(--dim); margin:6px 0 0; font-size:13px}
  .crumb{color:var(--dim2); font-size:12.5px; margin-bottom:12px}
  .crumb b{color:var(--dim); font-weight:600}
</style>
</head>
<body>
<header>
  <h1>数据结构与算法可视化</h1>
  <span class="book">严蔚敏《数据结构（C语言版）》· 逐章原理动画</span>
  <div class="prog">
    <span id="progTxt">0 / 0</span>
    <span class="bar"><i id="progBar" style="width:0"></i></span>
  </div>
</header>
<main>
  <nav id="nav">
    <div class="search"><input id="q" placeholder="搜索知识点，如 KMP、AVL、快排"></div>
    <div id="tree"></div>
  </nav>
  <section id="view">
    <div class="crumb" id="crumb"></div>
    <div id="host"></div>
  </section>
</main>

<script src="core/catalog.js"></script>
<script src="core/viz-draw.js"></script>
<script src="core/viz-core.js"></script>
<script src="app.js"></script>
</body>
</html>
